services:
  - type: web
    name: voynich-backend
    runtime: docker
    plan: free # switch to starter if weasyprint runs out of memory
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DB_NAME
        value: invoice_processing
      - key: BAM_API_URL
        value: https://api.centralbankofmorocco.ma/cours/Version1/api/CoursVirement
      - key: MONGO_URL
        sync: false
      - key: AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT
        sync: false
      - key: AZURE_DOCUMENT_INTELLIGENCE_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_FULL_NAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BAM_API_KEY
        sync: false

  - type: web
    name: voynich-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --ignore-scripts && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # https://<backend-url>/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
