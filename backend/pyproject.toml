[project]
name = "Invoice-Processing-API"
version = "0.1.0"
description = "Invoice Processing API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.0.0",
    "fastapi>=0.135.1",
    "pytest>=9.0.2",
    "uvicorn==0.34.3",
    "pydantic>=2.0.0",
    "pydantic[email]",
    "pymongo>=4.16.0",
    "certifi>=2024.0.0",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=5.0.0",
    "boto3>=1.42.59",
    "google-cloud-documentai>=3.10.0",
    "azure-core>=1.38.2",
    "azure-ai-documentintelligence>=1.0.2",
    "python-multipart>=0.0.22",
    "passlib[bcrypt]>=1.7.4",
    "azure-ai-documentintelligence>=1.0.2",
    "ruff>=0.15.4",
    "openpyxl>=3.1.0",
    "httpx>=0.28.1",
    "weasyprint>=68.1",
    "jinja2>=3.1.6",
]
[project.optional-dependencies]
dev = [
    "pre-commit>=3.0.0",
    "faker",
    "mongomock>=4.1.2",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
